name: 'partner_connect_trial_repo'
version: '1.0.0'
config-version: 2

profile: 'default'

source-paths: ["models"]
analysis-paths: ["analyses"]      # use "analyses" folder (plural) if that's in your repo
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_modules"

models:
  partner_connect_trial_repo:
    staging:
      +materialized: view
      +snowflake_warehouse: pc_dbt_wh
    marts:
      +materialized: table
      +snowflake_warehouse: pc_dbt_wh_large
